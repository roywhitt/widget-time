name: Citation du jour

on:
  schedule:
    - cron: "0 5 * * *"      # vers 6 h (heure de Paris)
    - cron: "0 11 * * *"     # 2e essai vers midi, au cas où le premier échoue
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Récupérer la citation du jour
        run: |
          python3 - <<'EOF'
          import json, re, html, datetime, time, urllib.request, xml.etree.ElementTree as ET

          UA = "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/rss+xml, application/xml, application/json, */*"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read()

          def brainyquote():
              root = ET.fromstring(get("https://www.brainyquote.com/link/quotebr.rss"))
              item = root.find("channel/item")
              author = html.unescape((item.findtext("title") or "").strip())
              quote = html.unescape(re.sub(r"<[^>]+>", "", item.findtext("description") or "")).strip().strip('"“” ')
              return quote, author

          def zenquotes():   # source de secours
              j = json.loads(get("https://zenquotes.io/api/today"))
              return j[0]["q"].strip(), j[0]["a"].strip()

          data = None
          for source in (brainyquote, zenquotes):
              for essai in range(3):
                  try:
                      quote, author = source()
                      if quote:
                          data = {"quote": quote, "author": author, "date": datetime.date.today().isoformat(), "source": source.__name__}
                          break
                  except Exception as e:
                      print(f"{source.__name__} essai {essai+1} : {e}")
                      time.sleep(5)
              if data:
                  break

          if not data:
              print("Aucune source disponible aujourd'hui : on garde la citation précédente.")
          else:
              with open("citation/quote.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(data)
          EOF

      - name: Enregistrer
        run: |
          git config user.name "citation-bot"
          git config user.email "citation-bot@users.noreply.github.com"
          git add citation/quote.json
          git diff --staged --quiet && exit 0
          git commit -m "Citation du jour"
          git pull --rebase --quiet || true
          git push
