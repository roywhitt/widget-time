name: Citation du jour

on:
  schedule:
    - cron: "0 5 * * *"     # tous les jours vers 6 h (heure de Paris)
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la citation du jour
        run: |
          curl -sSL -A "Mozilla/5.0 (citation-notion)" "https://www.brainyquote.com/link/quotebr.rss" -o feed.xml
          python3 - <<'EOF'
          import json, re, html, datetime, xml.etree.ElementTree as ET
          item = ET.parse("feed.xml").getroot().find("channel/item")
          author = html.unescape((item.findtext("title") or "").strip())
          quote = html.unescape(re.sub(r"<[^>]+>", "", item.findtext("description") or "")).strip().strip('"“” ')
          if not quote:
              raise SystemExit("Aucune citation trouvée")
          data = {"quote": quote, "author": author, "date": datetime.date.today().isoformat()}
          with open("citation/quote.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(data)
          EOF
          rm feed.xml

      - name: Enregistrer
        run: |
          git config user.name "citation-bot"
          git config user.email "citation-bot@users.noreply.github.com"
          git add citation/quote.json
          git diff --staged --quiet || git commit -m "Citation du jour"
          git push
