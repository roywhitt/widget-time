<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Piou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
#w{position:fixed;inset:0;border-radius:14px;overflow:hidden;background:transparent;clip-path:inset(0 round 14px)}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:default}
#bubs{position:absolute;left:10px;top:10px;pointer-events:none}
.bub{position:absolute;left:0;max-width:min(var(--bw),210px);transition:opacity .35s steps(4),transform .35s steps(4),top .4s steps(5),left .4s steps(5)!important;font-size:var(--fs,12px)!important;width:max-content;box-sizing:border-box;padding:7px 10px 8px;background:#fbfbf7;color:#2a1b16;
  font:500 12px/1.38 "Inter Tight",system-ui,sans-serif;box-shadow:0 0 0 2px #2a1b16,3px 3px 0 2px rgba(20,12,10,.35);
  opacity:0;transform:translateY(4px);transition:opacity .35s steps(4),transform .35s steps(4),top .4s steps(5);pointer-events:auto;cursor:default}
.bub.on{opacity:1;transform:none}
.bub.dim{opacity:.72}
.bub[data-u]{cursor:pointer}
.bub .join{display:inline-block;margin-top:6px;padding:3px 8px 4px;background:#ff5b2e;color:#fff;font-weight:700;font-size:11px;text-decoration:none;box-shadow:0 0 0 2px #2a1b16;cursor:pointer}
.bub .join:hover{background:#2a1b16}
.bub .join.now{animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{background:#2a1b16}}
.bub small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.05em;color:#ff5b2e;margin-bottom:1px;text-transform:uppercase}
.bub.tail::after{content:"";position:absolute;left:var(--tx);bottom:-8px;width:8px;height:8px;background:#fbfbf7;
  box-shadow:2px 0 0 #2a1b16,-2px 0 0 #2a1b16,0 2px 0 #2a1b16;clip-path:polygon(-3px 0,11px 0,11px 11px,-3px 11px)}
.bub.tail::before{content:"";position:absolute;left:calc(var(--tx) + 8px);bottom:-14px;width:5px;height:5px;background:#fbfbf7;box-shadow:0 0 0 2px #2a1b16}
#msg{position:absolute;left:10px;bottom:8px;font:600 10px/1.3 "Inter Tight",system-ui,sans-serif;color:rgba(255,255,255,.75);text-shadow:0 1px 0 rgba(0,0,0,.5);pointer-events:none}
</style>
</head>
<body>
<div id="w"><canvas id="c"></canvas><div id="bubs"></div><div id="msg"></div></div>
<script>
(() => {
'use strict';
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ================= horloge (réglable pour tester : ?t=07:30&date=2026-12-24) =================
const T0 = Date.now();
function now(){
  const d = new Date();
  if (Q.get('date')){ const [y, m, dd] = Q.get('date').split('-').map(Number); d.setFullYear(y, m - 1, dd); }
  if (Q.get('t')){ const [h, mi] = Q.get('t').split(':').map(Number); d.setHours(h, mi || 0, 0, 0); d.setTime(d.getTime() + (Date.now() - T0)); }
  return d;
}
const mins = d => d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const hm = d => `${d.getHours()}h${d.getMinutes() ? String(d.getMinutes()).padStart(2, '0') : ''}`;
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];

// ================= météo réelle (Open-Meteo, sans clé) — ?meteo=pluie|neige|orage|vent|soleil|brouillard|nuageux|canicule|froid =================
const LAT = +(Q.get('lat') || 48.8566), LON = +(Q.get('lon') || 2.3522);
let W = { code: 1, temp: 12, wind: 8, gust: 15, cloud: 30, rain: 0, sunrise: 7 * 60 + 40, sunset: 17 * 60 + 5, ok: false };
const FORCE = {
  pluie: { code: 63, cloud: 95, rain: 2, wind: 14, gust: 25 }, averse: { code: 81, cloud: 85, rain: 4, wind: 18, gust: 30 }, bruine: { code: 53, cloud: 90, rain: .4 },
  neige: { code: 73, cloud: 90, temp: -1, wind: 8 }, orage: { code: 95, cloud: 100, rain: 6, wind: 30, gust: 55 }, vent: { code: 2, cloud: 45, wind: 42, gust: 70 },
  soleil: { code: 0, cloud: 0, temp: 24, wind: 6, gust: 10 }, canicule: { code: 0, cloud: 0, temp: 33, wind: 4 }, froid: { code: 1, cloud: 15, temp: -4, wind: 6 },
  brouillard: { code: 45, cloud: 100, wind: 3 }, nuageux: { code: 3, cloud: 100, wind: 10 }, eclaircies: { code: 2, cloud: 50, wind: 10 } };
async function loadWeather(){
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,wind_speed_10m,wind_gusts_10m,cloud_cover,precipitation&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
    const j = await (await fetch(u)).json(), c = j.current;
    const tm = s => { const d = new Date(s); return d.getHours() * 60 + d.getMinutes(); };
    W = { code: c.weather_code, temp: c.temperature_2m, wind: c.wind_speed_10m, gust: c.wind_gusts_10m, cloud: c.cloud_cover, rain: c.precipitation,
      sunrise: tm(j.daily.sunrise[0]), sunset: tm(j.daily.sunset[0]), ok: true };
  } catch (e) {}
  if (FORCE[Q.get('meteo')]) Object.assign(W, FORCE[Q.get('meteo')]);
  sky.dirty = true; buildWeatherFx(); rebuild();
}
const wx = () => {
  const c = W.code;
  return { storm: c >= 95, snow: (c >= 71 && c <= 77) || c === 85 || c === 86, rain: (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95,
    drizzle: c >= 51 && c <= 57, fog: c === 45 || c === 48, clear: c <= 1 && W.cloud < 40, overcast: c === 3 || W.cloud > 80,
    windy: W.gust >= 45 || W.wind >= 32, breezy: W.gust >= 28 || W.wind >= 18, hot: W.temp >= 29, warm: W.temp >= 20, cold: W.temp <= 4, freezing: W.temp <= 0 };
};
const wxText = () => { const x = wx(), t = `${Math.round(W.temp)}°C`;
  if (x.storm) return `${t} et de l'orage. Je ne bouge pas d'ici.`;
  if (x.snow) return `${t}, il neige ! Bonnet obligatoire.`;
  if (x.rain && x.windy) return `${t}, pluie et vent. Le parapluie ne tiendra pas, j'ai mon ciré.`;
  if (x.drizzle) return `${t}, petite bruine. Parapluie de sortie.`;
  if (x.rain) return `${t} et de la pluie. Prends un parapluie, moi j'ai le mien.`;
  if (x.windy) return `${t} et beaucoup de vent. Je m'accroche à mon poteau !`;
  if (x.fog) return `${t}, brouillard. Je ne vois même pas le poteau d'en face.`;
  if (x.hot) return `${t} ! Canicule. Bois de l'eau, moi je prends une glace.`;
  if (x.clear && x.warm) return `${t} et grand soleil. Séance bronzage.`;
  if (x.freezing) return `${t}, ça caille. Écharpe et bonnet de rigueur.`;
  if (x.cold) return `${t}, frisquet. Couvre-toi bien.`;
  if (x.clear) return `${t}, ciel dégagé. Belle journée.`;
  if (x.overcast) return `${t}, ciel tout gris. Rien de grave.`;
  return `${t}, quelques nuages. Ça se tient.`; };

// ================= fêtes et saisons =================
function easter(y){ const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
  h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return new Date(y, mo - 1, da); }
const ANNIV = (Q.get('anniv') || '').split(/[-/.]/).map(Number); // jj-mm
function fete(d){
  const m = d.getMonth() + 1, j = d.getDate(), h = d.getHours(), md = m * 100 + j;
  const e = easter(d.getFullYear()), de = Math.round((new Date(d.getFullYear(), m - 1, j) - e) / 864e5);
  if (ANNIV.length === 2 && ANNIV[0] === j && ANNIV[1] === m) return { k: 'monanniv', hat: 'party', obj: 'cake', fx: 'confetti', msg: 'Joyeux anniversaire !! Gâteau, chapeau, confettis : tout est prêt.' };
  if (md === 1231 || (md === 101)) return { k: 'nouvelan', hat: 'party', fx: (md === 1231 && h >= 20) || (md === 101 && h < 3) ? 'fireworks' : 'confetti', msg: md === 101 ? 'Bonne année ! Je prends de bonnes résolutions : moins de graines.' : 'Dernier jour de l\'année ! On fête ça ce soir.' };
  if (md === 106) return { k: 'rois', hat: 'crown', msg: "C'est l'Épiphanie. J'ai eu la fève !" };
  if (md === 202) return { k: 'chandeleur', hand: 'crepe', msg: 'Chandeleur ! Une crêpe, puis deux, puis dix.' };
  if (md === 214) return { k: 'valentin', fx: 'hearts', neck: 'bowtie', msg: 'Saint-Valentin. Des cœurs partout, même sur les fils.' };
  if (md === 317) return { k: 'patrick', hat: 'clover', msg: "Saint-Patrick ! Tout est vert aujourd'hui." };
  if (md === 401) return { k: 'poisson', back: 'fish', msg: "Rien d'anormal ici. Absolument rien dans mon dos." };
  if (de >= -1 && de <= 1) return { k: 'paques', hat: 'bunny', obj: 'egg', msg: "Joyeuses Pâques ! J'ai trouvé un œuf sur le poteau." };
  if (md === 501) return { k: 'muguet', beak: 'muguet', msg: '1er mai : un brin de muguet pour toi.' };
  if (md === 621) return { k: 'musique', hat: 'headphones', fx: 'notes', msg: 'Fête de la musique ! Je chante faux mais fort.' };
  if (md === 714) return { k: 'quatorze', hand: 'flag', fx: h >= 21 ? 'fireworks' : null, msg: h >= 21 ? 'Feu d\'artifice du 14 juillet ! Ooooh. Aaaah.' : '14 juillet ! Défilé, puis feu d\'artifice ce soir.' };
  if (m === 10 && j >= 25 || md === 1101 && h < 6) return { k: 'halloween', hat: 'witch', obj: 'pumpkin', fx: 'bats', msg: j === 31 ? 'Halloween ! Des bonbons ou un sort.' : 'Halloween approche… les citrouilles sont de sortie.' };
  if (m === 12 && j <= 26){ const noel = j === 24 || j === 25;
    return { k: 'noel', hat: 'santa', fx: 'lights', msg: j === 25 ? 'Joyeux Noël ! Ho ho ho (en piou).' : j === 24 ? 'Réveillon ce soir ! Laisse des graines pour le Père Noël.' : `Noël dans ${25 - j} jour${25 - j > 1 ? 's' : ''}. Les guirlandes sont posées.`, big: noel }; }
  if (m === 12 || (m === 1 && j <= 6)) return { k: 'fetes', fx: 'lights', msg: null };
  return null;
}
function saison(d){ const md = (d.getMonth() + 1) * 100 + d.getDate();
  return md >= 320 && md < 621 ? 'printemps' : md >= 621 && md < 922 ? 'ete' : md >= 922 && md < 1221 ? 'automne' : 'hiver'; }

// ================= calendrier Notion =================
const CODE = Q.get('code') || '', DB = Q.get('db') || '', DEMO = Q.get('demo');
const API = Q.get('api') || 'https://disque-widget.vercel.app/api/agenda';
let EVENTS = [], ERR = '';
function demoEvents(){ const d = now(), at = (dd, h, mi) => { const x = new Date(d); x.setDate(x.getDate() + dd); x.setHours(h, mi || 0, 0, 0); return x.toISOString(); };
  const day = dd => { const x = new Date(d); x.setDate(x.getDate() + dd); return x.toISOString().slice(0, 10); };
  return [
    { id: 1, url: '#', title: 'Anniversaire de Léa', start: day(0), allDay: true },
    { id: 2, url: '#', title: 'Rdv avec Paul', start: at(0, 10, 30), end: at(0, 11, 30), place: 'Café Oberkampf' },
    { id: 3, url: '#', title: 'Dentiste', start: at(0, 14), end: at(0, 14, 45) },
    { id: 4, url: '#', title: 'Théâtre : Cyrano', start: at(0, 20), end: at(0, 22, 30), place: 'Comédie-Française' },
    { id: 5, url: '#', title: 'Call production', start: at(1, 9, 30), end: at(1, 10) },
    { id: 7, url: '#', title: 'Point avec Tie Brek', start: new Date(d.getTime() + 10 * 60000).toISOString(), end: new Date(d.getTime() + 40 * 60000).toISOString(), meet: 'https://meet.google.com/abc-defg-hij' },
    { id: 6, url: '#', title: 'Concert Fred again..', start: at(3, 21) } ]; }
async function loadEvents(){
  if (DEMO){ EVENTS = demoEvents(); rebuild(); return; }
  try {
    const r = await fetch(`${API}${DB ? `?db=${encodeURIComponent(DB)}` : ''}`, { headers: { 'x-key': CODE } });
    const j = await r.json();
    if (!r.ok){ ERR = j.error === 'code incorrect' ? 'Code incorrect dans le lien.' : j.error && /AGENDA_ICS/.test(j.error) ? "Je n'ai pas encore l'adresse de ton agenda (AGENDA_ICS sur Vercel)." : j.error === 'object_not_found' ? "Notion ne trouve pas le calendrier : partage-le avec ton intégration." : (j.error || 'Erreur agenda'); }
    else { EVENTS = j.events || []; ERR = ''; }
  } catch (e) { ERR = 'Calendrier injoignable pour le moment.'; }
  rebuild();
}

// ================= comprendre chaque événement =================
const who = e => { if (e.people) return e.people.split(',')[0].trim();
  const m = e.title.match(/(?:avec|chez|w\/|with)\s+([A-ZÀ-Ý][\wÀ-ÿ'’-]+(?:\s+[A-ZÀ-Ý][\wÀ-ÿ'’-]+)?)/) || e.title.match(/(?:anniv(?:ersaire)?|bday|birthday)\s*(?:de\s+|d['’]\s*|:\s*|-\s*)?([A-ZÀ-Ý][\wÀ-ÿ'’-]+)/i);
  return m ? m[1] : ''; };
const lieu = e => e.place ? ` (${e.place})` : '';
// k = catégorie, re = mots qui la déclenchent, prop = accessoire porté autour du rendez-vous, up/now/past = phrases
const CATS = [
  { k: 'anniv', re: /anniv|birthday|bday/i, prop: 'party', up: (e, W) => `C'est l'anniversaire de ${who(e) || 'quelqu\'un de cher'} ! N'oublie pas de lui souhaiter.`, now: e => `Joyeux anniversaire à ${who(e) || 'toi-sais-qui'} ! J'ai mis mon chapeau.`, past: e => `Tu as bien souhaité l'anniversaire de ${who(e) || 'la personne'} ?` },
  { k: 'theatre', re: /th[ée][âa]tre|pi[èe]ce|op[ée]ra|ballet|spectacle|com[ée]die|one.?man|stand.?up/i, prop: 'bowtie', up: (e, W) => `${W} : ${e.title}${lieu(e)}. Waouh, du théâtre ! Bonne représentation.`, now: () => 'Lever de rideau ! Profite bien du spectacle.', past: () => 'Alors, cette pièce ? Standing ovation ?' },
  { k: 'concert', re: /concert|festival|\blive\b|\bdj\b|gig|showcase/i, prop: 'headphones', up: (e, W) => `${W} : ${e.title}. Je chauffe mes cordes vocales.`, now: () => 'Ça joue ! Fais du bruit pour moi.', past: () => 'Les oreilles bourdonnent encore ?' },
  { k: 'cine', re: /cin[ée]|\bfilm\b|s[ée]ance|projection|avant.?premi[èe]re/i, prop: 'popcorn', up: (e, W) => `${W} : ${e.title}. Garde-moi du pop-corn.`, now: () => 'Chut, ça commence. Téléphone en silencieux.', past: () => 'Alors, ce film ? Je veux tout savoir (sans spoiler).' },
  { k: 'expo', re: /expo|mus[ée]e|galerie|vernissage|biennale/i, prop: 'beret', up: (e, W) => `${W} : ${e.title}${lieu(e)}. Ouvre grand les yeux.`, now: () => 'Prends ton temps devant chaque œuvre.', past: () => 'Une œuvre coup de cœur ?' },
  { k: 'mariage', re: /mariage|wedding|pacs/i, prop: 'bowtie', up: (e, W) => `${W} : ${e.title}. Sors le nœud papillon !`, now: () => 'Vive les mariés !', past: () => 'Tu as dansé jusqu\'au bout ?' },
  { k: 'fete', re: /f[êe]te|soir[ée]e|party|teuf|crémaillère|cremaillere/i, prop: 'party', up: (e, W) => `${W} : ${e.title}. Ce soir on danse !`, now: () => 'Que la fête commence !', past: () => 'Bonne soirée hier ? Doucement ce matin.' },
  { k: 'date', re: /date\b|en amoureux|valentin|rencard/i, prop: 'bowtie', up: (e, W) => `${W} : ${e.title}. Oh là là… bonne soirée !`, now: () => 'Je regarde ailleurs, promis.', past: () => 'Alors, alors ? Raconte.' },
  { k: 'resto', re: /resto|restaurant|d[îi]ner|d[ée]j(eu|\b)|brunch|lunch|bouffe|repas/i, prop: 'napkin', up: (e, W) => `${W} : ${e.title}${lieu(e)}. Bon appétit d'avance !`, now: () => 'Bon appétit ! Garde-moi une miette.', past: () => 'C\'était bon ? Je veux le menu.' },
  { k: 'apero', re: /ap[ée]ro|un verre|\bbar\b|drinks?|bi[èe]re|afterwork/i, prop: 'party', up: (e, W) => `${W} : ${e.title}. Santé !`, now: () => 'Santé ! Un jus de graines pour moi.', past: () => 'Pas trop tard hier ?' },
  { k: 'medecin', re: /m[ée]decin|docteur|dentiste|kin[ée]|ost[ée]o|ophtalmo|dermato|gyn[ée]co|h[ôo]pital|analyse|radio|vaccin|psy\b/i, prop: null, up: (e, W) => `${W} : ${e.title}. Courage, ça va bien se passer.`, now: () => 'Courage, je pense à toi.', past: () => 'C\'est fait ! Bravo, une bonne chose de faite.' },
  { k: 'sport', re: /sport|salle|gym|run|course|footing|jogging|foot\b|yoga|pilates|piscine|natation|tennis|padel|escalade|boxe|v[ée]lo|muscu|crossfit|danse/i, prop: 'headband', up: (e, W) => `${W} : ${e.title}. Allez, on transpire !`, now: () => 'Plus vite ! Plus haut ! (Moi je regarde.)', past: () => 'Bravo pour la séance. N\'oublie pas les étirements.' },
  { k: 'voyage', re: /voyage|vol\b|avion|a[ée]roport|train|tgv|gare|eurostar|road.?trip|valise|check.?in/i, prop: 'goggles', up: (e, W) => `${W} : ${e.title}. Bon voyage ! Envoie-moi une carte postale.`, now: () => 'En route ! Billets, passeport, chargeur ?', past: () => 'Bien arrivé ?' },
  { k: 'tournage', re: /tournage|shoot|rep[ée]rage|casting|plateau|clip|tourn[ée]e/i, prop: 'headband', up: (e, W) => `${W} : ${e.title}${lieu(e)}. Bon courage à toute l'équipe !`, now: () => 'Silence sur le plateau… je retiens mes piou.', past: () => 'Dans la boîte ! Belle journée de travail.' },
  { k: 'montage', re: /montage|[ée]talonnage|mixage|post.?prod|edit\b|retouche|rendu|export/i, prop: 'glasses', up: (e, W) => `${W} : ${e.title}. Café et concentration.`, now: () => 'Je ne te dérange pas, tu es dans le flow.', past: () => 'Exporté ? Bravo.' },
  { k: 'deadline', re: /deadline|date limite|[ée]ch[ée]ance|livraison|rendu|remise|dossier/i, prop: 'headband', up: (e, W) => `${W} : ${e.title}. Deadline ! Tu vas tout déchirer.`, now: () => 'Dernière ligne droite ! Je crois en toi.', past: () => 'C\'est envoyé ? Respire.' },
  { k: 'call', re: /call|appel|visio|zoom|meet\b|teams|t[ée]l[ée]phone|facetime/i, prop: 'headphones', up: (e, W) => `${W} : ${e.title}. Je me tais pendant l'appel, promis.`, now: () => 'Chut, appel en cours.', past: () => 'Bon appel ?' },
  { k: 'reunion', re: /r[ée]union|meeting|point\b|brief|debrief|pr[ée]sentation|pitch|entretien|interview|comit[ée]/i, prop: 'tie', up: (e, W) => `${W} : ${e.title}. Café avant la réunion ?`, now: () => 'Réunion en cours. Prends des notes, moi je garde le poteau.', past: () => 'Comment s\'est passée la réunion ?' },
  { k: 'cours', re: /cours\b|atelier|formation|workshop|masterclass|conf[ée]rence|s[ée]minaire|examen|partiel/i, prop: 'glasses', up: (e, W) => `${W} : ${e.title}. Bon cours, prends des notes.`, now: () => 'Écoute bien, interro après.', past: () => 'Tu as appris un truc ?' },
  { k: 'famille', re: /maman|papa|m[èe]re|p[èe]re|mamie|papi|grand.?m[èe]re|grand.?p[èe]re|famille|parents|fr[èe]re|s(œ|oe)ur|cousin|tonton|tata/i, prop: null, up: (e, W) => `${W} : ${e.title}. Bisous à la famille !`, now: () => 'Profite de la famille.', past: () => 'Tout le monde va bien ?' },
  { k: 'coiffeur', re: /coiff|barbier|cheveux|coupe\b/i, prop: null, up: (e, W) => `${W} : ${e.title}. Nouvelle tête en vue !`, now: () => 'Pas trop court derrière !', past: () => 'Montre ta nouvelle coupe !' },
  { k: 'courses', re: /courses|march[ée]|supermarch|monop|carrefour|picard|biocoop|ikea/i, prop: null, up: (e, W) => `${W} : ${e.title}. Tu me ramènes des graines ?`, now: () => 'N\'oublie pas les graines.', past: () => 'Frigo rempli !' },

    if (Math.random() < dt * .02) fxs.push({ kind: 'spark', x: rnd(0, AW * .7), y: rnd(0, AH * .3), vx: 60, vy: 25, c: '#ffffff', life: .5, t: 0 });
  }
  if (L_.day > .05){ const m = mins(d), f = clamp((m - W.sunrise) / (W.sunset - W.sunrise), 0, 1), sxp = lerp(AW * .08, AW * .92, f), syp = AH * .55 - Math.sin(f * Math.PI) * AH * .42;
    const vis = x.overcast || x.rain || x.fog ? .25 : 1;
    ax.fillStyle = `rgba(255,236,160,${.35 * L_.day * vis})`; disc(ax, sxp, syp, 6.5); ax.fillStyle = `rgba(255,${L_.glow > .3 ? 190 : 230},${L_.glow > .3 ? 110 : 120},${L_.day * vis})`; disc(ax, sxp, syp, 4.3); }
  drawClouds(ax, d, dt, L_);
  const F = fete(d);
  if (F && F.fx === 'fireworks' && night > .4) fireworks(ax, dt);
  // premier plan : poteau, objets, oiseau
  fx.clearRect(0, 0, AW, AH);
  const lamp = drawPole(fx, d, L_, t);
  const objKind = F && F.obj;
  if (objKind) drawObj(fx, objKind, pole.x + 11, pole.y + 7, t, night > .5);
  updateBird(d, t, dt);
  const pose = birdPose(d, t, dt, L_), o = outfit(d);
  drawBird(pose, o, t, W.wind);
  const by = Math.round(bird.y - bird.hop + (bird.state === 'perch' && bird.landT > 0 ? 1 : 0));
  fx.drawImage(bcv, Math.round(bird.x) - BO.x, by - BO.y);
  // nuit : le premier plan s'assombrit, le lampadaire éclaire autour de lui
  const lampOn = night > .45 || x.fog || x.storm;
  if (night > .05){ fx.globalCompositeOperation = 'source-atop'; fx.fillStyle = `rgba(8,12,40,${night * .55})`; fx.fillRect(0, 0, AW, AH); fx.globalCompositeOperation = 'source-over'; }
  ax.drawImage(FG, 0, 0);
  if (lampOn){ const fl = .92 + Math.sin(t * 9) * .04 * (x.storm ? 3 : 1);
    ax.fillStyle = `rgba(255,214,120,${.95 * fl})`; P(ax, lamp.LX - 1, lamp.LY, 4, 1);
    for (let r = 14; r > 0; r -= 2){ ax.fillStyle = `rgba(255,200,110,${.045 * fl})`; disc(ax, lamp.LX + 1, lamp.LY, r); }
    for (let y = lamp.LY + 1; y < AH; y++){ const w = (y - lamp.LY) * .55; for (let xx = -w; xx <= w; xx++){ if (((xx | 0) + y) % 2) continue; ax.fillStyle = `rgba(255,214,140,${.07 * (1 - (y - lamp.LY) / (AH - lamp.LY))})`; P(ax, lamp.LX + 1 + xx, y); } } }
  else { ax.fillStyle = '#c8cdd4'; P(ax, lamp.LX - 1, lamp.LY, 4, 1); }
  drawFx(ax, d, dt, L_);
  // brouillard
  if (x.fog){ for (let i = 0; i < 4; i++){ const yy = AH * (.25 + i * .18), off = (t * (3 + i)) % AW; ax.fillStyle = 'rgba(220,226,232,.16)'; for (let k = -1; k < 2; k++){ ax.fillRect(off + k * AW - AW * .2, yy, AW * .7, 5 + i); } } ax.fillStyle = 'rgba(210,216,224,.18)'; ax.fillRect(0, 0, AW, AH); }
  // orage
  if (x.storm){ nextBolt -= dt; if (nextBolt <= 0){ nextBolt = rnd(3, 9); flash = .18; bolt = { x: rnd(5, AW * .5), pts: [] }; let bx = bolt.x, byy = 0; while (byy < AH * .5){ bolt.pts.push([bx, byy]); byy += rnd(2, 5); bx += rnd(-3, 3); } } }
  if (flash > 0){ flash -= dt; ax.fillStyle = `rgba(255,255,255,${flash * 2.5})`; ax.fillRect(0, 0, AW, AH); if (bolt){ ax.fillStyle = '#fffbe0'; for (let i = 1; i < bolt.pts.length; i++){ const [x0, y0] = bolt.pts[i - 1], [x1, y1] = bolt.pts[i]; const n = Math.max(1, Math.abs(y1 - y0)); for (let k = 0; k <= n; k++) P(ax, lerp(x0, x1, k / n), lerp(y0, y1, k / n)); } } }
  // à l'écran
  cx.imageSmoothingEnabled = false; cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.drawImage(A, 0, 0, AW, AH, 0, 0, AW * S * dpr, AH * S * dpr);
  // texte des bulles : machine à écrire, rotation
  for (const b of slots){ const sp = b.querySelector('span'); if (b._i < b._full.length){ b._i = Math.min(b._full.length, b._i + dt * 40); sp.textContent = b._full.slice(0, Math.floor(b._i)); } }
  if (bird.state !== 'arrive' && t - lastRot > 9){ lastRot = t; if (MSGS.length > 2){ rot++; syncBubbles(false); } layoutBubbles(); }
  if (bird.state !== 'arrive' && $('bubs').style.visibility !== 'visible'){ $('bubs').style.visibility = 'visible'; syncBubbles(true); }
  requestAnimationFrame(frame);
}
$('bubs').style.visibility = 'hidden';
addEventListener('resize', () => { layout(); if (bird.state === 'perch'){ bird.x = perch.x; bird.y = perch.y; } });
layout(); rebuild(); arrive();
loadWeather(); loadEvents();
setInterval(loadWeather, 10 * 60 * 1000); setInterval(loadEvents, 3 * 60 * 1000); setInterval(rebuild, 60 * 1000);
setInterval(() => layoutBubbles(), 1500);
requestAnimationFrame(frame);
})();
</script>
